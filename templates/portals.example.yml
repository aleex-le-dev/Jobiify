# Configuration des portails — Jobiify
# Marché local : Lières / Lillers (62190) · Bassin Béthune-Bruay · Artois · Flandre intérieure · Métropole lilloise
#
# Les grosses sources (France Travail + partenaires, Jooble, Adzuna, WTTJ, Choisir le
# Service Public) sont interrogées par l'app web (Explorer) autour de
# Lières dans un rayon de RECHERCHE_RAYON_KM (défaut 50 km). Les employeurs ci-dessous
# sont scannés directement sur leur site carrière (ATS public, zéro clé).

# ── Filtres de titre ──────────────────────────────────────────────
# Laissés vides : dans l'application, les métiers recherchés viennent de chaque
# profil (un profil par CV). Remplissez-les seulement pour le scan en ligne de
# commande (node scripts/scan.mjs).
title_filter:
  positive: []
  negative: []

# ── Filtres de localisation (centré sur Lières / Lillers 62190) ───
location_filter:
  # Aligné sur la zone de trajet de 30 min autour de Lières (communes > 3 000 hab.).
  # Pour élargir (Lens, Arras, Lille…), augmente le temps de trajet dans l'Explorer
  # ou ajoute des villes ici. Pas de "Pas-de-Calais"/"Nord" : trop vagues, ils laissaient tout passer.
  always_allow:
    - "Lières"
    - "Lillers"
    - "62190"
  allow:
    - "Télétravail"
    - "Béthune"
    - "Bethune"
    - "Beuvry"
    - "Annezin"
    - "Bruay-la-Buissière"
    - "Bruay"
    - "Auchel"
    - "Isbergues"
    - "Aire-sur-la-Lys"
    - "Lestrem"
    - "Nœux-les-Mines"
    - "Noeux-les-Mines"
    - "Liévin"
    - "Lievin"
    - "Bully-les-Mines"
    - "Mazingarbe"
    - "Barlin"
    - "Houdain"
    - "Divion"
    - "Loos-en-Gohelle"
    - "Grenay"
    - "Hersin-Coupigny"
    - "Sains-en-Gohelle"
    - "Marles-les-Mines"
    - "Calonne-Ricouart"
    - "Haillicourt"
    - "Vermelles"
    - "Auchy-les-Mines"
    - "Haisnes"
    - "Hulluch"
    - "Violaines"
    - "La Bassée"
    - "Verquin"
    - "Lapugnoy"
    - "Chocques"
    - "Saint-Venant"
    - "Ruitz"
    - "Saint-Omer"
    - "Longuenesse"
    - "Arques"
    - "Blendecques"
    - "Wizernes"
    - "Lumbres"
    - "Saint-Martin-lez-Tatinghem"
    - "Hazebrouck"
    - "Merville"
    - "Estaires"
    - "La Gorgue"
    - "Laventie"
    - "Sailly-sur-la-Lys"
    - "Steenwerck"
    - "Saint-Pol-sur-Ternoise"
  block:
    - "United States"
    - "USA"
    - "Canada"
    - "India"
    - "United Kingdom"
    - "London"
    - "Belgique"
    - "België"
    - "Nederland"
    - "Germany"
    - "Deutschland"
    - "Algeria"
    - "Spain"
    - "Italy"

# ── Sources ATS pour l'explorateur web ────────────────────────────
# "portals" = sources régionales (France Travail, Jooble, Adzuna, Careerjet, WTTJ, Service Public)
# + employeurs et agences d'intérim ci-dessous. Ajoutez "workday" pour inclure les grands groupes (plus lent).
explore_ats:
  - portals

# ── Employeurs régionaux suivis (ATS public vérifié) ──────────────
tracked_companies:
  - name: Decathlon Technology
    careers_url: https://job-boards.eu.greenhouse.io/decathlontechnology
    provider: greenhouse
    enabled: true
    notes: "Siège Villeneuve-d'Ascq / Lille. Pôle digital : dev, cloud, data, support."

  - name: OVHcloud
    careers_url: https://careers.ovhcloud.com
    provider: successfactors
    enabled: false
    notes: "Roubaix. Désactivé : le site SuccessFactors d'OVH n'expose pas l'endpoint lu par le scanner (404). Ses offres remontent via WTTJ et France Travail."

  - name: Boulanger
    careers_url: https://jobs.smartrecruiters.com/Boulanger
    provider: smartrecruiters
    enabled: true
    notes: "Siège Lesquin. IT, SAV, magasins Nord."

  - name: Kiabi
    careers_url: https://jobs.smartrecruiters.com/Kiabi
    provider: smartrecruiters
    enabled: true
    notes: "Siège Lezennes. IT, logistique, magasins Hauts-de-France."

  - name: Lesaffre
    careers_url: https://jobs.smartrecruiters.com/Lesaffre
    provider: smartrecruiters
    enabled: true
    notes: "Marcq-en-Barœul / Marquette-lez-Lille. Industrie agro, IT industriel."

  - name: Alten
    careers_url: https://jobs.smartrecruiters.com/Alten
    provider: smartrecruiters
    enabled: true
    notes: "ESN/ingénierie. Agences Villeneuve-d'Ascq, Douai. Gros volume HdF."

  - name: Conforama
    careers_url: https://jobs.smartrecruiters.com/Conforama
    provider: smartrecruiters
    enabled: true
    notes: "Magasins + SAV/techniciens itinérants en Hauts-de-France."

  - name: Adeo (Leroy Merlin groupe)
    careers_url: https://adeo.teamtailor.com
    provider: teamtailor
    enabled: true
    notes: "Ronchin / Lezennes. Tech, marketplace, IT groupe."

  - name: Norsys
    careers_url: https://norsys.teamtailor.com
    provider: teamtailor
    enabled: true
    notes: "ESN dont le siège est à Ennevelin (59). Développeurs Java/web."

  - name: Ankama
    careers_url: https://ankama.teamtailor.com
    provider: teamtailor
    enabled: true
    notes: "Studio de jeux vidéo à Roubaix. Dev, IT."

  - name: Jules
    careers_url: https://jules.teamtailor.com
    provider: teamtailor
    enabled: true
    notes: "Siège Roubaix/Lille (mode). Fonctions support et IT."

  - name: Verkor
    careers_url: https://jobs.lever.co/verkor
    provider: lever
    enabled: true
    notes: "Gigafactory batteries Bourbourg (Dunkerque). Maintenance, IT industriel."

  # ── Agences d'intérim (ATS public) ──
  - name: Manpower France
    category: interim
    careers_url: https://jobs.smartrecruiters.com/ManpowerFrance
    provider: smartrecruiters
    enabled: true
    notes: "Missions intérim + CDI. Agences Béthune, Lens, Arras, Lille, Douai."

  - name: Groupe Crit (postes en agence)
    careers_url: https://groupecrit.teamtailor.com
    provider: teamtailor
    enabled: true
    notes: "Postes permanents dans les agences Crit (Lens, Lille, Lesquin…). Les missions Crit passent par France Travail / Jooble / Adzuna."

  - name: Gojob
    careers_url: https://jobs.lever.co/gojob
    provider: lever
    enabled: true
    notes: "Intérim digital. Postes internes, dont Hauts-de-France (59/62)."

# ── Agences d'intérim (sitemaps publics des offres) ──────────────
# Toutes les missions de l'agence sont lues, puis seules celles situées à
# moins de rayon_km de Lières sont gardées (communes réelles via geo.api.gouv.fr).
job_boards:
  - name: Randstad (intérim)
    category: interim
    provider: interim-sitemap
    interim:
      agency: randstad
      departements: ["62", "59"]
      origin: { lat: 50.5489, lon: 2.412 }
      rayon_km: 60
    enabled: true
    notes: "Missions + CDI Randstad autour de Lières."

  - name: Synergie (intérim)
    category: interim
    provider: interim-sitemap
    interim:
      agency: synergie
      departements: ["62", "59"]
      origin: { lat: 50.5489, lon: 2.412 }
      rayon_km: 60
    enabled: true
    notes: "Missions Synergie (Béthune, Lillers, Aire-sur-la-Lys, Douvrin…)."

# ── Requêtes de recherche web (mode IA / WebSearch) ───────────────
# Découverte via moteur de recherche uniquement : les résultats sont des pistes
# d'agrégateur, à confirmer chez l'employeur (AGENTS.md). Toujours la zone 30 min.
search_queries:
  - name: "LinkedIn — Informatique autour de Lillers"
    query: 'site:linkedin.com/jobs/view ("technicien informatique" OR "support informatique" OR "helpdesk" OR "développeur") ("Lillers" OR "Béthune" OR "Bruay-la-Buissière" OR "Auchel" OR "Isbergues" OR "Aire-sur-la-Lys" OR "Liévin" OR "Hazebrouck" OR "Saint-Omer" OR "Merville")'
    enabled: true

  - name: "Indeed — Informatique zone 30 min"
    query: 'site:fr.indeed.com ("technicien informatique" OR "support informatique" OR "développeur web") ("Lillers" OR "Béthune" OR "Bruay-la-Buissière" OR "Auchel" OR "Isbergues" OR "Aire-sur-la-Lys" OR "Liévin" OR "Hazebrouck" OR "Saint-Omer" OR "Merville")'
    enabled: true

  - name: "HelloWork — Informatique zone 30 min"
    query: 'site:hellowork.com/fr-fr/emplois ("technicien" OR "support informatique" OR "helpdesk" OR "développeur") ("Lillers" OR "Béthune" OR "Bruay-la-Buissière" OR "Auchel" OR "Isbergues" OR "Aire-sur-la-Lys" OR "Liévin" OR "Hazebrouck" OR "Saint-Omer" OR "Merville")'
    enabled: true

  - name: "Meteojob / Cadremploi / Monster / Talent.com"
    query: '(site:meteojob.com OR site:cadremploi.fr OR site:monster.fr OR site:fr.talent.com) ("informatique" OR "technicien" OR "développeur") ("Lillers" OR "Béthune" OR "Bruay-la-Buissière" OR "Auchel" OR "Isbergues" OR "Aire-sur-la-Lys" OR "Liévin" OR "Hazebrouck" OR "Saint-Omer" OR "Merville")'
    enabled: true

  - name: "Intérim — grands réseaux"
    query: '(site:adecco.fr OR site:proman-emploi.fr OR site:crit-job.com OR site:startpeople.fr OR site:samsic-emploi.fr OR site:partnaire.fr OR site:supplay.fr) ("informatique" OR "technicien" OR "support") ("Lillers" OR "Béthune" OR "Bruay-la-Buissière" OR "Auchel" OR "Isbergues" OR "Aire-sur-la-Lys" OR "Liévin" OR "Hazebrouck" OR "Saint-Omer" OR "Merville")'
    enabled: true

  - name: "Intérim — réseaux régionaux et digitaux"
    query: '(site:leaderinterim.com OR site:temporis-franchise.fr OR site:groupeactual.eu OR site:domino-rh.com OR site:triangle.fr OR site:interaction-interim.com OR site:gojob.com OR site:iziwork.com OR site:qapa.fr) ("Lillers" OR "Béthune" OR "Bruay-la-Buissière" OR "Auchel" OR "Isbergues" OR "Aire-sur-la-Lys" OR "Liévin" OR "Hazebrouck" OR "Saint-Omer" OR "Merville")'
    enabled: true

  - name: "Intérim IT (Expectra, Hays, Page Interim)"
    query: '(site:expectra.fr OR site:hays.fr OR site:pageinterim.fr) ("technicien" OR "support" OR "développeur" OR "administrateur") ("Lillers" OR "Béthune" OR "Bruay-la-Buissière" OR "Auchel" OR "Isbergues" OR "Aire-sur-la-Lys" OR "Liévin" OR "Hazebrouck" OR "Saint-Omer" OR "Merville")'
    enabled: true

  - name: "Fonction publique / hôpitaux — Informatique"
    query: '(site:emploi-territorial.fr OR site:choisirleservicepublic.gouv.fr OR site:fhf.fr) ("informatique" OR "développeur" OR "systèmes et réseaux") ("Lillers" OR "Béthune" OR "Bruay-la-Buissière" OR "Auchel" OR "Isbergues" OR "Aire-sur-la-Lys" OR "Liévin" OR "Hazebrouck" OR "Saint-Omer" OR "Merville")'
    enabled: true

  - name: "Apec — Informatique zone 30 min"
    query: 'site:apec.fr ("Développeur" OR "Administrateur systèmes" OR "Technicien") ("Lillers" OR "Béthune" OR "Bruay-la-Buissière" OR "Auchel" OR "Isbergues" OR "Aire-sur-la-Lys" OR "Liévin" OR "Hazebrouck" OR "Saint-Omer" OR "Merville")'
    enabled: true


  - name: "leboncoin — Offres d'emploi zone 30 min"
    query: 'site:leboncoin.fr/offres_d_emploi ("Lillers" OR "Béthune" OR "Bruay-la-Buissière" OR "Auchel" OR "Isbergues" OR "Aire-sur-la-Lys" OR "Liévin" OR "Hazebrouck" OR "Saint-Omer" OR "Merville")'
    enabled: true

  - name: "Sites grand public (Jobijoba, Hellowork, Monster, StepStone, Talent.com, Jobrapido)"
    query: '(site:jobijoba.com OR site:hellowork.com OR site:monster.fr OR site:stepstone.fr OR site:fr.talent.com OR site:fr.jobrapido.com) ("Lillers" OR "Béthune" OR "Bruay-la-Buissière" OR "Auchel" OR "Isbergues" OR "Aire-sur-la-Lys" OR "Liévin" OR "Hazebrouck" OR "Saint-Omer" OR "Merville")'
    enabled: true

  - name: "Petits boulots et missions courtes (StaffMe, Side, Qapa, Student Pop, Brigad)"
    query: '(site:staffme.fr OR site:side.co OR site:qapa.fr OR site:studentpop.com OR site:brigad.co) ("Lillers" OR "Béthune" OR "Bruay-la-Buissière" OR "Auchel" OR "Isbergues" OR "Aire-sur-la-Lys" OR "Liévin" OR "Hazebrouck" OR "Saint-Omer" OR "Merville")'
    enabled: true

  - name: "Recrutement direct des collectivités (CA Béthune-Bruay, Département 62, mairies)"
    query: '(site:bethunebruay.fr OR site:pasdecalais.fr OR site:hautsdefrance.fr OR site:ville-lillers.fr OR site:bethune.fr) ("recrutement" OR "offre d''emploi")'
    enabled: true

preferred_languages: [fr]
max_posting_age_days: 30
